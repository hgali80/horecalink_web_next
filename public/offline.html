<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b3a53"><title>HorecaLink</title><style>body{font-family:system-ui,sans-serif;background:#f8fafc;color:#0b3a53;margin:0;padding:24px;display:grid;min-height:80vh;place-items:center}main{max-width:420px}button{background:#0b3a53;color:white;border:0;border-radius:8px;padding:12px 20px;font:inherit;cursor:pointer}</style></head><body><main><h1>HorecaLink</h1><h2 id="title">Нет подключения к интернету</h2><p id="body">Проверьте подключение и попробуйте снова.</p><button id="retry" type="button">Повторить</button></main><script>
const messages={ru:['Нет подключения к интернету','Проверьте подключение и попробуйте снова.','Повторить'],tr:['İnternet bağlantısı yok','Bağlantınızı kontrol edip tekrar deneyin.','Tekrar dene'],kz:['Интернет байланысы жоқ','Байланысты тексеріп, қайталап көріңіз.','Қайталау'],en:['You are offline','Check your connection and try again.','Try again']};
let lang='ru';try{lang=localStorage.getItem('hl_lang')||'ru'}catch{}
const text=messages[lang]||messages.ru;document.documentElement.lang=lang==='kz'?'kk':lang;['title','body','retry'].forEach((id,i)=>document.getElementById(id).textContent=text[i]);document.getElementById('retry').onclick=()=>location.reload();
</script></body></html>
